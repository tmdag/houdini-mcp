[project]
name = "houdinimcp"
version = "0.1.0"
description = "MCP bridge connecting SideFX Houdini to Claude AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 1.x and 2.x are both supported: mcp 2.0 renamed FastMCP to MCPServer
    # and moved the module, so the bridge imports through a shim and
    # tests/test_mcp_compat.py pins both paths. The lock tracks 2.x.
    "mcp[cli]>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houdinimcp"]

[project.scripts]
houdinimcp-bridge = "houdini_mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a running houdini-bin (HOUDINIMCP_LIVE=1)",
]
